<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer">
<style>html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}#g{width:100%;height:100%}</style>
</head><body><div id="g"></div><script>
const CDNS=[p=>"https://cdn.jsdelivr.net/gh/"+p,p=>"https://fastly.jsdelivr.net/gh/"+p,p=>"https://gcore.jsdelivr.net/gh/"+p,p=>"https://testingcf.jsdelivr.net/gh/"+p,p=>"https://quantil.jsdelivr.net/gh/"+p,p=>"https://cdn.jsdmirror.com/gh/"+p];
const B=["Vrkids2009/snowrider3d","6b7c2b9167b592528b221428414e63f06c4640b9","SnowRider3D-gd-1.json"];
const R=n=>Math.random().toString(36).slice(2,2+n);
let n=0,ok=false;
function probe(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),3500);return fetch(u,{mode:"no-cors",cache:"no-store",signal:c.signal}).then(()=>true).catch(()=>false).finally(()=>clearTimeout(t));}
async function go(){
 if(ok)return; if(n++>7)return;
 const o=CDNS.slice().sort(()=>Math.random()-.5);
 const c=o.slice(0,4).map(f=>f(B[0]+"@"+B[1]+"/"));
 const r=await Promise.all(c.map(u=>probe(u+"TemplateData/UnityProgress.js")));
 mount(c[r.indexOf(true)]||o[0](B[0]+"@"+B[1]+"/"));
}
function mount(base){
 const bust="?v="+R(6);
 const s=document.createElement("script");
 s.src=base+"TemplateData/UnityProgress.js";
 const w=setTimeout(()=>{if(!ok){s.remove();go();}},8000);
 s.onerror=()=>{clearTimeout(w);go();};
 s.onload=()=>{
  clearTimeout(w);
  const s2=document.createElement("script");
  s2.src=base+"Build/UnityLoader.js";
  s2.onerror=()=>go();
  s2.onload=()=>{try{
   window.gameInstance=UnityLoader.instantiate("g",base+"Build/"+B[2]+bust,{onProgress:UnityProgress,Module:{onRuntimeInitialized:function(){ok=true;UnityProgress(gameInstance,"complete");}}});
  }catch(e){go();}};
  document.head.appendChild(s2);
 };
 document.head.appendChild(s);
}
go();
</script></body></html>
